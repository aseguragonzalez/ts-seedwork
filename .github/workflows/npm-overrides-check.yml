name: npm overrides staleness check

# Weekly, offset from the dependabot ignore staleness check (Monday 08:00) so
# the two don't compete for runners or clutter the Actions log at the same
# time.
on:
  schedule:
    - cron: '0 8 * * 3'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check npm overrides
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Check overrides
        run: node scripts/check-npm-overrides.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
