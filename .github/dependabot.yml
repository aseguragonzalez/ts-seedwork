version: 2

updates:
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    target-branch: main

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # vitepress-plugin-mermaid peer range is mermaid 10 || 11
      - dependency-name: 'mermaid'
        update-types: ['version-update:semver-major']
    target-branch: main

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
